name: Deploy Django (Dev)

# Só roda quando um PR é fechado no branch develop
on:
  pull_request:
    branches:
      - develop
    types:
      - closed

jobs:
  deploy:
  # Só roda se além do PR fechado, também houve um merge.
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
    - name: Verify required secrets
      run: |
        missing=0
        for var in SSH_PRIVATE_KEY_DEV SERVER_DEV SERVER_USER_DEV LOCATION_DEV; do
          if [ -z "${!var}" ]; then
            echo "Missing secret: $var"
            missing=1
          fi
        done
        if [ "$missing" -eq 1 ]; then
          echo "One or more required secrets are not set. Aborting."
          exit 1
        fi
      env:
        SSH_PRIVATE_KEY_DEV: ${{ secrets.SSH_PRIVATE_KEY_DEV }}
        SERVER_DEV: ${{ secrets.SERVER_DEV }}
        SERVER_USER_DEV: ${{ secrets.SERVER_USER_DEV }}
        LOCATION_DEV: ${{ secrets.LOCATION_DEV }}

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup SSH
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY_DEV }}

    - name: Add server to known_hosts
      run: |
        mkdir -p ~/.ssh
        ssh-keyscan -H ${{ secrets.SERVER_DEV }} >> ~/.ssh/known_hosts

    - name: Deploy code via rsync
      run: |
        rsync -az --delete \
          --exclude=".git" \
          --exclude=".github" \
          --exclude=".env" \
          ./ ${{ secrets.SERVER_USER_DEV }}@${{ secrets.SERVER_DEV }}:${{ secrets.LOCATION_DEV }}

    - name: Restart Docker Compose
      run: |
        ssh ${{ secrets.SERVER_USER_DEV }}@${{ secrets.SERVER_DEV }} << 'EOF'
        cd ${{ secrets.LOCATION_DEV }}
        docker compose pull || true
        docker compose build --no-cache
        docker compose up -d
        docker image prune -f
        EOF
